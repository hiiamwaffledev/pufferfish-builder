name: build
# Manual only. Runs on the free public-repo runner (4 vCPU / 16 GB). Output object is encrypted with PF_ARTIFACT_KEY.
on:
  workflow_dispatch:
    inputs:
      target:
        description: ios (object for the phone) | linux (desktop test executable)
        default: ios
      mode:
        description: vanilla | crema | crema-jit
        default: crema
      instance:
        description: Minecraft version (vanilla) or <mc>-fabric-<loader> (baked Fabric API + flat launcher)
        default: "26.3"
      mods:
        description: Fabric only, mod URLs to bake (space-separated; empty = Fabric API)
        default: ""
      analysis:
        description: pointsto | rta (rta only works for vanilla)
        default: pointsto
      heap:
        description: builder heap (-Xmx)
        default: 12g
      parallelism:
        description: compile threads
        default: "4"
      gc:
        description: parallel | serial | g1
        default: parallel
      extra:
        description: extra native-image args
        default: ""

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PF_TARGET: ${{ inputs.target }}
      PF_MODE: ${{ inputs.mode }}
      PF_MODS: ${{ inputs.mods }}
      PF_INSTANCE: ${{ inputs.instance }}
      PF_ANALYSIS: ${{ inputs.analysis }}
      PF_HEAP: ${{ inputs.heap }}
      PF_PAR: ${{ inputs.parallelism }}
      PF_GC: ${{ inputs.gc }}
      PF_EXTRA: ${{ inputs.extra }}
    steps:
      - uses: actions/checkout@v4

      - name: runner info + free disk
        run: |
          set -x
          nproc; free -h; swapon --show || true; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          sudo apt-get install -y -qq zstd zlib1g-dev build-essential >/dev/null

      - name: cache GraalVM downloads
        uses: actions/cache@v4
        with:
          path: .dl
          key: graalvm-25.0.4.1.1

      - name: fetch Minecraft jars
        env:
          PF_MODS: ${{ inputs.mods }}
        run: |
          i='${{ inputs.instance }}'
          if [[ $i == *-fabric-* ]]; then ci/fetch-mc.sh "${i%%-fabric-*}" "${i##*-fabric-}"; else ci/fetch-mc.sh "$i"; fi

      - name: cross toolchain (official GraalVM CE)
        run: ci/setup-toolchain.sh

      - name: bake Fabric (Knot + Mixin once on the JVM)
        if: contains(inputs.instance, '-fabric-')
        run: ci/bake.sh "$PF_INSTANCE"

      - name: mod API surface (scan top Modrinth mods)
        if: startsWith(inputs.mode, 'crema')
        run: ci/modapi.sh "$PF_INSTANCE"

      - name: runtime-mixin hooks (HookGen + rebake)
        if: startsWith(inputs.mode, 'crema') && contains(inputs.instance, '-fabric-')
        run: ci/hooks.sh "$PF_INSTANCE"

      - name: native-image
        run: ci/build-mc.sh "$PF_INSTANCE" "$PF_MODE"

      - name: encrypt object
        env:
          PF_ARTIFACT_KEY: ${{ secrets.PF_ARTIFACT_KEY }}
        run: |
          n=$(cat logs/name.txt)
          ci/package.sh "$n"
          echo "PF_NAME=$n" >> "$GITHUB_ENV"

      - name: upload encrypted object
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PF_NAME }}-encrypted
          path: out/${{ env.PF_NAME }}.tar.zst.enc
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: summary
        if: always()
        run: |
          free -h; df -h /
          ci/summary.sh
          rm -f logs/oom.hprof  # heap dumps hold Minecraft classes/strings; never uploaded

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 14
